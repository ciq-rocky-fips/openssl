name: Build OpenSSL FIPS module

on:
  push:
  pull_request:
    branches: [dist-git]

jobs:
  mockBuild:
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        rocky_version: ['92', '96']
        arch: ['x86_64', 'aarch64']
        include:
          - rocky_version: '92'
            arch: 'x86_64'
            config_file: 'rocky-lts92-x86_64.cfg'
            dist_suffix: 'el9_2.ciq'
            version_name: 'Rocky 9.2 x86_64'
          - rocky_version: '92'
            arch: 'aarch64'
            config_file: 'rocky-lts92-aarch64.cfg'
            dist_suffix: 'el9_2.ciq'
            version_name: 'Rocky 9.2 aarch64'
          - rocky_version: '96'
            arch: 'x86_64'
            config_file: 'rocky-lts96-x86_64.cfg'
            dist_suffix: 'el9_6_ciq'
            version_name: 'Rocky 9.6 x86_64'
          - rocky_version: '96'
            arch: 'aarch64'
            config_file: 'rocky-lts96-aarch64.cfg'
            dist_suffix: 'el9_6_ciq'
            version_name: 'Rocky 9.6 aarch64'
    container:
      image: quay.io/rockylinux/rockylinux:9
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build openssl rpm for ${{ matrix.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          unset DEBUG
          mkdir -p RESULTS

          echo "Building for ${{ matrix.version_name }} using ${{ matrix.config_file }}"

          echo "Installing mock and deps"
          dnf -y install epel-release
          dnf -y --setopt=tsflags=nodocs install mock rpm-build dnf-plugins-core createrepo_c
          dnf clean all || true

          # Prove and prepare rights
          echo "Before group fix:"
          id && groups || true
          groupadd -f mock
          usermod -a -G mock root
          echo "After group fix (shell won't see new groups unless we use sg/newgrp):"
          id && groups || true

          export HOME=/root XDG_CACHE_HOME=/root/.cache

          echo "Setting up mock config for ${{ matrix.version_name }}"
          mkdir -p /etc/mock
          echo "Current directory: $(pwd)"
          echo "Looking for config file: ${{ matrix.config_file }}"
          ls -la .mock-config/ || echo "No .mock-config directory found"
          
          # Use absolute path from GitHub workspace
          cp ${GITHUB_WORKSPACE}/.mock-config/${{ matrix.config_file }} /etc/mock/ || \
          cp ./.mock-config/${{ matrix.config_file }} /etc/mock/ || \
          { echo "Cannot find mock config file: ${{ matrix.config_file }}"; exit 1; }
          
          echo "config_opts['macros']['provider'] = 'provider'" >> /etc/mock/${{ matrix.config_file }}
          
          echo "Mock config contents:"
          cat /etc/mock/${{ matrix.config_file }}

          # Extract config name without .cfg extension
          CONFIG_NAME="${{ matrix.config_file }}"
          CONFIG_NAME="${CONFIG_NAME%.cfg}"

          echo "Running mock build for ${{ matrix.version_name }} (via mock group; avoids 'Insufficient rights.')"
          sg mock -c "mock -v -r ${CONFIG_NAME} \
            --isolation=simple \
            --disable-plugin=tmpfs \
            --spec ./SPECS/openssl.spec \
            --sources ./SOURCES \
            --resultdir ./RESULTS \
            --verbose"

          echo "Contents of result directory"
          ls -l ./RESULTS

          # Create provider tarball from produced RPMs
          cd RESULTS
          shopt -s nullglob
          rpms=(openssl-libs-3*ciq*.${{ matrix.arch }}.rpm)
          if (( ${#rpms[@]} == 0 )); then
            echo "No matching openssl-libs ciq RPMs found" >&2
            exit 1
          fi
          IFS=$'\n' read -r first <<< "$(printf '%s\n' "${rpms[@]}" | sort | head -n1)"
          RPMVERSION="$(sed -E 's/.*openssl-libs-(3[^ ]*)\.'"${{ matrix.arch }}"'\.rpm/\1/' <<<"$first")"
          echo "Creating fips provider tarball for version: ${RPMVERSION}"
          tarball="openssl-fips-provider-rocky${{ matrix.rocky_version }}-${{ matrix.arch }}-${RPMVERSION}.tar.gz"
          tar -czf "${tarball}" ./*.rpm
          sha256sum "${tarball}" > "${tarball}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fips_module_RESULTS_rocky${{ matrix.rocky_version }}_${{ matrix.arch }}
          retention-days: 365
          path: |
            RESULTS/*.log
            RESULTS/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fips_tarball_rocky${{ matrix.rocky_version }}_${{ matrix.arch }}
          retention-days: 365
          path: |
            RESULTS/*.tar.gz
            RESULTS/*.tar.gz.sha256

      # Create a release for permanent storage (only on dist-git branch pushes)
      - name: Create Release
        if: github.ref == 'refs/heads/dist-git' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-rocky${{ matrix.rocky_version }}-${{ matrix.arch }}-${{ github.sha }}
          name: "FIPS Module ${{ matrix.version_name }} - ${{ github.sha }}"
          body: |
            OpenSSL FIPS Module built for ${{ matrix.version_name }}

            Built from commit: ${{ github.sha }}
            Build date: ${{ github.run_number }}
          files: |
            RESULTS/*.tar.gz
            RESULTS/*.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
