name: Build OpenSSL FIPS module

on:
  push:
  pull_request:
    branches: [dist-git]

jobs:
  mockBuild:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    container:
      image: quay.io/rockylinux/rockylinux:9
      options: >-
        --privileged
        --user root
        -v ${{ github.workspace }}/.mock-config:/etc/mock:ro
    steps:
      - uses: actions/checkout@v4
      - name: Build openssl rpm
        run: |
          unset DEBUG
          mkdir -p RESULTS
          # Ensure we have room for /etc/mock (bind-mount it to somewhere with space)
          mkdir -p /var/etc-mock
          mkdir -p /etc/mock
          if ! mountpoint -q /etc/mock; then
            mount -o bind /var/etc-mock /etc/mock
          fi
          df -h /etc/mock || true
          if [ -z "$DEBUG" ]; then
              echo "Installing mock"
              dnf -y install epel-release
              dnf -y --setopt=tsflags=nodocs install mock rpm-build
              echo "Running mock build"
              echo "config_opts['macros']['provider'] = 'provider'" >> .mock-config/rocky-lts92-x86_64.cfg
              export HOME=/root XDG_CACHE_HOME=/root/.cache
              mock -v -r .mock-config/rocky-lts92-x86_64.cfg \
                --isolation=simple \
                --disable-plugin=tmpfs \
                --spec="./SPECS/openssl.spec" \
                --sources="./SOURCES" \
                --resultdir="./RESULTS" \
                --verbose
          else
              set -x
              set +e
              touch RESULTS/openssl-libs-3.0.7-27.el9_2.ciqfips.0.2.1.x86_64.rpm
              echo "Fake build log for your sprog" > RESULTS/build.log
          fi
          echo "Contents of result directory"
          ls -l ./RESULTS

          # Extract the FIPS module
          cd RESULTS
          RPMVERSION=$(ls ./openssl-libs-3*ciqfips*.x86_64.rpm | sed -e 's/.*openssl-libs-\(3.*\)\.x86_64\.rpm/\1/')
          echo "Creating fips provider tarball"
          tar -czf openssl-fips-provider-${RPMVERSION}.tar.gz *.rpm
          sha256sum openssl-fips-provider-${RPMVERSION}.tar.gz > openssl-fips-provider-${RPMVERSION}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: fips_module_RESULTS
          path: |
            RESULTS/*.log
            RESULTS/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fips_tarball
          path: |
            RESULTS/*.tar.gz
            RESULTS/*.tar.gz.sha256
